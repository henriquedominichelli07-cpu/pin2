<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso - PIN</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        linear-gradient(135deg, rgba(10,20,40,.75), rgba(20,80,120,.55)),
        url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1920&q=80")
        center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}

.container {
    display: flex;
    align-items: center;
    gap: 70px;
    padding: 30px;
}

.login-box {
    width: 360px;
    padding: 40px;
    background: rgba(255,255,255,.13);
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 25px;
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
}

.login-box h1 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 32px;
}

.input-group {
    margin-bottom: 18px;
}

.input-group label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

.input-group input {
    width: 100%;
    padding: 14px;
    border: 2px solid transparent;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
    background: rgba(255,255,255,.92);
    color: #222;
    transition: .3s;
}

.input-group input:focus {
    border-color: #00bfff;
}

.input-group input.erro {
    background: #ffe0c2;
    border: 3px solid orange;
}

.esqueci {
    display: block;
    text-align: right;
    color: #fff;
    margin-bottom: 22px;
    font-size: 14px;
    text-decoration: none;
}

.esqueci:hover {
    text-decoration: underline;
}

.botoes {
    display: flex;
    gap: 10px;
}

button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

.btn-acessar {
    background: #F97316d1;
    color: white;
}

.btn-acessar:hover {
    transform: translateY(-2px);
}

.btn-cadastrar {
    background: white;
    color: #F97316;
}

.btn-cadastrar:hover {
    background: #e9f8ff;
    transform: translateY(-2px);
}

.btn-voltar {
    background: white;
    color: #F97316;
}

.btn-bloqueado {
    background: gray !important;
    color: white !important;
    cursor: not-allowed;
}

.logo img {
    width: 600px;
    height: auto;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: none;
    align-items: center;
    justify-content: center;
}

.modal.ativo {
    display: flex;
}

.modal-content {
    width: 300px;
    padding: 35px;
    text-align: center;
    background: white;
    color: #222;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    animation: aparecer .3s ease;
}

.modal-content h2 {
    color: #08a045;
    margin-bottom: 12px;
}

.modal-content.erro-modal h2 {
    color: #d9534f;
}

.modal-content button {
    margin-top: 20px;
    background: #08a045;
    color: white;
    width: 100%;
}

@keyframes aparecer {
    from {
        transform: scale(.7);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}

@media (max-width: 700px) {
    .container {
        flex-direction: column;
        gap: 25px;
    }

    .logo {
        order: -1;
        width: 120px;
        height: 120px;
    }

    .login-box {
        width: min(90vw, 360px);
        padding: 30px;
    }
}

@media (max-width: 380px) {
    .botoes {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <img src="logo.png" alt="Logo do projeto">
    </div>

    <div class="login-box">

        <h1 id="titulo">Acesso</h1>

        <div class="input-group">
            <label for="usuario">E-mail</label>

            <input
                type="email"
                id="usuario"
                placeholder="Digite seu e-mail"
                onblur="validarEmailCampo()">
        </div>

        <div class="input-group">
            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                oninput="verificarSenhaLogin()">
        </div>

        <div class="input-group" id="grupoConfirmar" style="display:none;">

            <label for="confirmarSenha">Confirmar senha</label>

            <input
                type="password"
                id="confirmarSenha"
                placeholder="Digite novamente sua senha">
        </div>

        <a href="#" class="esqueci" id="esqueci" onclick="return false;">
            Esqueci a senha
        </a>

        <div class="botoes">

            <button
                class="btn-acessar"
                id="botaoPrincipal"
                onclick="entrar()">
                Entrar
            </button>

            <button
                class="btn-cadastrar"
                id="botaoCadastro"
                onclick="modoCadastro()">
                Cadastro
            </button>

            <button
                class="btn-voltar"
                id="botaoVoltar"
                onclick="modoLogin()"
                style="display:none;">
                Voltar
            </button>

        </div>

    </div>
</div>

<div class="modal" id="modal">

    <div class="modal-content" id="modalContent">

        <h2 id="modalTitulo">Sucesso!</h2>

        <p id="modalMensagem"></p>

        <button onclick="fecharModal()">OK</button>

    </div>

</div>

<script>

const usuario = document.getElementById("usuario");
const senha = document.getElementById("senha");
const confirmarSenha = document.getElementById("confirmarSenha");

const grupoConfirmar = document.getElementById("grupoConfirmar");

const titulo = document.getElementById("titulo");

const botaoPrincipal = document.getElementById("botaoPrincipal");
const botaoCadastro = document.getElementById("botaoCadastro");
const botaoVoltar = document.getElementById("botaoVoltar");

const esqueci = document.getElementById("esqueci");


function abrirModal(tituloTexto, mensagem, erro = false) {

    const modal = document.getElementById("modal");
    const modalContent = document.getElementById("modalContent");

    document.getElementById("modalTitulo").textContent = tituloTexto;

    document.getElementById("modalMensagem").textContent = mensagem;

    modalContent.classList.toggle("erro-modal", erro);

    modal.classList.add("ativo");
}


function fecharModal() {

    document.getElementById("modal").classList.remove("ativo");

}


function emailValido(email) {

    const arroba = email.indexOf("@");

    if (arroba <= 0) {
        return false;
    }

    const ponto = email.indexOf(".", arroba + 1);

    if (ponto <= arroba + 1) {
        return false;
    }

    if (ponto + 2 >= email.length) {
        return false;
    }

    return true;
}


async function gerarHash(texto) {

    const dados = new TextEncoder().encode(texto);

    const hashBuffer = await crypto.subtle.digest(
        "SHA-256",
        dados
    );

    return Array.from(new Uint8Array(hashBuffer))
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("");
}


function modoCadastro() {

    titulo.textContent = "Cadastro";

    grupoConfirmar.style.display = "block";

    botaoPrincipal.textContent = "Cadastrar";

    botaoCadastro.style.display = "none";

    botaoVoltar.style.display = "block";

    esqueci.style.display = "none";

    usuario.value = "";
    senha.value = "";
    confirmarSenha.value = "";

    usuario.classList.remove("erro");
    senha.classList.remove("erro");
    confirmarSenha.classList.remove("erro");

    botaoPrincipal.disabled = false;

    botaoPrincipal.classList.remove("btn-bloqueado");

    usuario.focus();
}


function modoLogin() {

    titulo.textContent = "Acesso";

    grupoConfirmar.style.display = "none";

    botaoPrincipal.textContent = "Entrar";

    botaoCadastro.style.display = "block";

    botaoVoltar.style.display = "none";

    esqueci.style.display = "block";

    usuario.value = "";
    senha.value = "";
    confirmarSenha.value = "";

    usuario.classList.remove("erro");
    senha.classList.remove("erro");
    confirmarSenha.classList.remove("erro");

    bloquearBotao();

    usuario.focus();
}


function validarEmailCampo() {

    if (titulo.textContent === "Cadastro") {

        if (usuario.value.trim() === "") {
            return;
        }

        if (!emailValido(usuario.value.trim())) {

            usuario.classList.add("erro");

            abrirModal(
                "E-mail inválido",
                "Digite um e-mail válido no primeiro campo.",
                true
            );

            usuario.focus();

            return;
        }

        usuario.classList.remove("erro");

        return;
    }

    validarEmailLogin();
}


function validarEmailCadastro() {

    if (!emailValido(usuario.value.trim())) {

        usuario.classList.add("erro");

        abrirModal(
            "E-mail inválido",
            "Digite um e-mail válido no primeiro campo.",
            true
        );

        usuario.focus();

        return false;
    }

    usuario.classList.remove("erro");

    return true;
}


async function cadastrarUsuario() {

    if (!validarEmailCadastro()) {
        return;
    }

    if (senha.value.length < 8) {

        senha.classList.add("erro");

        abrirModal(
            "Senha inválida",
            "Crie uma senha com pelo menos 8 caracteres.",
            true
        );

        senha.focus();

        return;
    }

    senha.classList.remove("erro");


    if (confirmarSenha.value.trim() === "") {

        confirmarSenha.classList.add("erro");

        abrirModal(
            "Confirme sua senha",
            "Digite novamente a senha que deseja criar no campo abaixo da senha.",
            true
        );

        confirmarSenha.focus();

        return;
    }

    confirmarSenha.classList.remove("erro");


    if (senha.value !== confirmarSenha.value) {

        senha.value = "";

        confirmarSenha.value = "";

        senha.classList.add("erro");

        confirmarSenha.classList.add("erro");

        abrirModal(
            "Senhas diferentes",
            "A confirmação de senha está diferente da senha. Digite novamente os dois campos.",
            true
        );

        senha.focus();

        return;
    }


    const email = usuario.value.trim().toLowerCase();

    const hash = await gerarHash(
        senha.value + email
    );


    localStorage.setItem(
        "emailCadastrado",
        email
    );

    localStorage.setItem(
        "senhaHash",
        hash
    );


    abrirModal(
        "Cadastro realizado!",
        "Cadastro realizado com sucesso. Agora você pode fazer login."
    );


    modoLogin();

    usuario.value = email;
}


function validarEmailLogin() {

    if (usuario.value.trim() === "") {
        return;
    }


    if (!emailValido(usuario.value.trim())) {

        usuario.classList.add("erro");

        abrirModal(
            "E-mail inválido",
            "Digite um e-mail válido no primeiro campo.",
            true
        );

        senha.value = "";

        bloquearBotao();

        usuario.focus();

        return;
    }


    const emailCadastrado =
        localStorage.getItem("emailCadastrado");


    if (
        !emailCadastrado ||
        emailCadastrado !== usuario.value.trim().toLowerCase()
    ) {

        usuario.classList.add("erro");

        abrirModal(
            "E-mail não cadastrado",
            "Este e-mail não está cadastrado.",
            true
        );

        bloquearBotao();

        return;
    }


    usuario.classList.remove("erro");

}


async function verificarSenhaLogin() {

    if (titulo.textContent !== "Acesso") {
        return;
    }

    bloquearBotao();


    const email =
        usuario.value.trim().toLowerCase();

    const senhaDigitada =
        senha.value;


    if (
        !emailValido(email) ||
        senhaDigitada === ""
    ) {
        return;
    }


    const emailCadastrado =
        localStorage.getItem("emailCadastrado");

    const hashArmazenado =
        localStorage.getItem("senhaHash");


    if (
        !emailCadastrado ||
        email !== emailCadastrado
    ) {
        return;
    }


    const hashDigitado =
        await gerarHash(
            senhaDigitada + email
        );


    if (hashDigitado === hashArmazenado) {

        botaoPrincipal.disabled = false;

        botaoPrincipal.classList.remove(
            "btn-bloqueado"
        );
    }
}


function bloquearBotao() {

    botaoPrincipal.disabled = true;

    botaoPrincipal.classList.add(
        "btn-bloqueado"
    );
}


async function entrar() {

    if (titulo.textContent === "Cadastro") {

        await cadastrarUsuario();

        return;
    }


    if (botaoPrincipal.disabled) {
        return;
    }


    abrirModal(
        "Login realizado!",
        "Login realizado com sucesso."
    );
}


modoLogin();

</script>

</body>
</html>
